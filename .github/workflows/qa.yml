name: QA

# 部署后 canary：Deploy 成功后对线上跑状态矩阵。它不是合并门（合并门 = main 分支保护）；
# QA 红 = 改动已上线且有问题，需尽快修复后重新部署。详见 docs/agent-workflow.md。

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 状态矩阵 QA（线上，CDN 传播竞态自动重试）
        run: |
          for i in 1 2 3; do
            if node scripts/qa-check.mjs; then
              echo "QA 通过（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次失败（可能是 CDN 未传播新版本），60s 后重试"
            sleep 60
          done
          echo "三次尝试均失败"
          exit 1
        env:
          BASE: https://tinycove.space
